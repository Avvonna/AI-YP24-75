services:
  streamlit:
    build:
      context: ./Streamlit
      dockerfile: Dockerfile
    container_name: streamlit_container
    ports:
      - "8501:8501"
    depends_on:
      fastapi:
        condition: service_healthy
    environment:
      - BACKEND_URL=http://fastapi:8000
    volumes:
      - ./Streamlit:/app
    restart: unless-stopped
    networks:
      - app_network

  fastapi:
    build:
      context: ./FastAPI
      dockerfile: Dockerfile
    container_name: fastapi_container
    ports:
      - "8000:8000"
    volumes:
      - ./FastAPI:/app
      - ./FastAPI/logs:/app/logs
    restart: unless-stopped
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 1m
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  app_network:
    driver: bridge
